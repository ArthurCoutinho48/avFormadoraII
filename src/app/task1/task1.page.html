<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>Avaliação Formadora II</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="ion-padding">

    <ion-grid fixed>
      <ion-row>

        <!--Card 01-->
        <ion-col size="12">
          <ion-card class="dark">
            <img [src]="imagemUrl" alt="Foto aleatória" style="width: 100%; border-radius: 10px;" />
            <ion-card-header>
              <ion-card-title>Academia</ion-card-title>
              <ion-card-subtitle class="task-card">
                <ion-icon name="stopwatch-outline" class="fl"></ion-icon>
                <p>1h</p>
              </ion-card-subtitle>
            </ion-card-header>

            <ion-card-content>
              <p>Realize 3 séries com 12 agachamentos, 10 flexões e 20 segundos de prancha.</p>
              <br>
              <p>Descanse 30 segundos entre os exercícios e 1 minuto entre as séries.</p>
              <br>
              <p>Finalize com 5 minutos de alongamento focado em pernas, costas e ombros.</p>
            </ion-card-content>
          </ion-card>
        </ion-col>

      </ion-row>
    </ion-grid>

  </div>

</ion-content>
